[project]
name = Wantok Service
id = wantok-service
repo_root = .
primary_language = typescript
framework = expo
default_branch = main

[context]
# Controls how the agent reads files
include_globs =
  app/**/*.ts
  app/**/*.tsx
  backend/**/*.ts
  backend/**/*.js
  supabase/**/*.sql
  supabase/**/*.toml
  packages/**/*.ts
  packages/**/*.tsx
  docs/**/*.md

exclude_globs =
  **/node_modules/**
  **/.git/**
  **/.expo/**
  **/dist/**
  **/build/**
  **/*.log
  **/*.lock
  **/*.png
  **/*.jpg
  **/*.jpeg
  **/*.mp4
  **/*.zip

max_file_size_kb = 512
max_total_files = 4000

[memory]
# Local cache to reduce re-reading everything
cache_dir = .wantok/memory
snapshot_dir = .wantok/snapshots
summary_style = strict
refresh_mode = changed-only

[git]
remote = origin
branch = main
commit_style = conventional
auto_pull_before_work = true
require_clean_worktree = false

[run]
# Execution policy for terminal commands
mode = suggest-only
# suggest-only: agent only prints commands
# confirm-each: agent asks you to run, or you copy/paste
# execute: CLI executes commands locally (you control it)
allowed_shells = cmd,powershell,bash
working_dir = .
timeout_seconds = 600

[security]
# Guardrails
block_destructive = true
blocked_commands =
  rm -rf
  del /f /q
  format
  diskpart
  shutdown
  reboot

# Only allow running from these folders
allowed_paths =
  app/
  backend/
  supabase/
  packages/
  scripts/

[ide]
# Optional: used by extensions later
vscode = true
pycharm = true

[workflows]
# named shortcuts you can call
dev = npm ci && npx expo start
backend = npm run db:start
lint = npm run lint
test = npm run check
typecheck = npm run typecheck
