name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and lint
        run: npm run check

      - name: Expo diagnostics
        run: npx --yes expo-doctor

      - name: Web export
        run: npx expo export --platform web --output-dir dist-ci-web

      - name: Android bundle export
        run: npx expo export --platform android --output-dir dist-ci-android

      - name: iOS bundle export
        run: npx expo export --platform ios --output-dir dist-ci-ios
