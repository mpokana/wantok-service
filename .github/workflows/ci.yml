name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend tooling
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Replay migrations from zero
        run: npm run db:reset

      - name: Database contract and workflow tests
        run: npm run db:test

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop || true
