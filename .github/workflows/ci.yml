name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and lint
        run: npm run check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Start local Supabase and replay migrations
        run: npm run db:start

      - name: Database contract tests
        run: npm run db:test

      - name: Web export
        run: npx expo export --platform web --output-dir dist-ci-web

      - name: Android bundle export
        run: npx expo export --platform android --output-dir dist-ci-android

      - name: iOS bundle export
        run: npx expo export --platform ios --output-dir dist-ci-ios

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop || true
